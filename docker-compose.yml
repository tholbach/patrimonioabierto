name: patrimonioabierto

services:
  web:
    # Matches the ingress proxy's own Caddy image choice for consistency.
    image: caddy:2
    # Renamed from cylinked_web (project rename) - the ingress proxy's own
    # Caddyfile (kept in its own repo, NOT this one) references this exact
    # container name in its reverse_proxy line. Update that config to
    # reverse_proxy patrimonioabierto_web:80 in the SAME deploy step as
    # this rename, or the site goes down until it's fixed - see the
    # README's "Deployment" section.
    container_name: patrimonioabierto_web
    volumes:
      - ./web:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Access log (see the log directive in Caddyfile). Bind-mounted to
      # the host rather than left in the container so it survives a
      # recreate, and so anything on the host can read it without going
      # through docker. Gitignored - these are the host's logs, not repo
      # content. Caddy writes them as root:root 0644 (mode is set in the
      # Caddyfile precisely so a non-root reader can get at them).
      - ./logs:/var/log/caddy
    networks:
      - ingress
    restart: unless-stopped
    # Hits the /healthz route added in the Caddyfile - curl is present in
    # the official image, no extra tooling needed. interval/timeout/
    # retries are Docker's own defaults spelled out rather than left
    # implicit, since the default start_period (0s) would otherwise mark a
    # container unhealthy for the brief moment Caddy takes to start.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  # No TLS/domain here on purpose - this container only serves static files
  # internally. A shared Caddy on the same host already owns ports 80/443
  # and the TLS certificates; this joins its network so that Caddy can
  # reverse_proxy to it, the same way the other services behind that proxy
  # already do. See this repo's README for the one-line Caddyfile addition
  # that wires it up.
  #
  # Overridable because the name is host-specific: whichever network the
  # proxy already sits on is whatever that host happens to call it. Set
  # INGRESS_NETWORK in a gitignored .env (see .env.example) to point this
  # somewhere else; the default below is the name to create if you are
  # setting this up fresh.
  #
  # A default rather than a required variable (${VAR:?...}): external
  # means Compose only ever looks the network up and never creates it, so
  # a name that does not exist fails the deploy outright with "declared
  # as external, but could not be found" - verified. There is no silent
  # failure mode to guard against here, and a repo that runs as cloned
  # beats one that needs a setup step first.
  ingress:
    name: ${INGRESS_NETWORK:-ingress}
    external: true
