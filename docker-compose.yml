name: patrimonioabierto

services:
  web:
    # Matches the ingress host's own Caddy image choice for consistency.
    image: caddy:2
    # Renamed from cylinked_web (project rename) - the external ingress
    # Caddyfile (the ingress proxy's own repository, NOT this repo) references this
    # exact container name in its own reverse_proxy line. Update that
    # config to reverse_proxy patrimonioabierto_web:80 in the SAME deploy
    # step as this rename, or the site goes down until it's fixed - see
    # the README's "Deployment" section.
    container_name: patrimonioabierto_web
    volumes:
      - ./web:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Access log (see the log directive in Caddyfile). Bind-mounted to
      # the host rather than left in the container so it survives a
      # recreate, and so anything on the host can read it without going
      # through docker. Gitignored - these are the host's logs, not repo
      # content. Caddy writes them as root:root 0644 (mode is set in the
      # Caddyfile precisely so a non-root reader can get at them).
      - ./logs:/var/log/caddy
    networks:
      - ingress
    restart: unless-stopped

networks:
  # No TLS/domain here on purpose - this container only serves static files
  # internally. The shared Caddy in the ingress proxy's own repository already owns
  # port 80/443 on the host and TLS certs for this site's domain; this joins its
  # network so that Caddy can reverse_proxy to it, the same way another service and
  # another service already do (see the ingress proxy's own repository). See this
  # repo's README for the one-line Caddyfile addition that wires it up.
  #
  # name: ingress, not just "ingress" -
  # that stack pins its Compose project name to "the ingress stack" but never
  # names this network explicitly, so Compose auto-prefixes it with the
  # project name. Verified against another stack's compose file, which joins
  # the same network and uses this exact full name (its own local alias is
  # called nc_connect, name differs, but the "name:" value matches).
  ingress:
    name: ingress
    external: true
